name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'reflections/**'
      - 'profile/**'
      - 'recommendations/**'
      - 'knowledge/**'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the bookshelf orders books by their last commit time.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font tools
        run: pip install fonttools brotli

      - run: npm ci
      # Builds book data from notes/ and reflections/, re-slices the font so newly added text is covered, then bundles the site.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
